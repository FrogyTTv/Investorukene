name: Claude Code Review

# Starts a Claude review each time a pull request is opened,
# gets new commits, is reopened, or is marked ready for review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel an older review of the same PR when new commits arrive.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip draft PRs. They are reviewed when marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Add ONE of these secrets in Settings > Secrets and variables > Actions.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This is a budget app built with
            React, TypeScript and Vite.

            Look for:
            - Bugs and logic errors, especially in money calculations
              (rounding, sums, negative values, empty input).
            - TypeScript type problems.
            - Security problems.
            - Performance problems.
            - Code that is hard to read or keep up to date.

            Only report problems that are in the changed lines of this PR.
            Do not report style details that a linter finds.

            Post each finding as an inline comment on the line it is about,
            with mcp__github_inline_comment__create_inline_comment.
            Then post one short summary comment on the PR with
            `gh pr comment`. If you find no problems, say so in the summary.
            Do not approve, merge or change the code.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
